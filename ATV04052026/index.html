<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTask</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="py-5">
    <div class="container text-center">
      <p class="eyebrow">Gerenciador de Tarefas</p>
      <h1>NTask</h1>
      <p class="subtitulo">Organize suas tarefas e defina prioridades</p>

      <div class="input-group input-nova-tarefa mx-auto mt-4">
        <input
          type="text"
          id="inputTarefa"
          class="form-control"
          placeholder="Digite uma nova tarefa…"
          autocomplete="off"
        >
        <button id="btnAdicionar" class="btn btn-adicionar">Adicionar</button>
      </div>
    </div>
  </header>

  <main class="container pb-5">
    <div id="contadorContainer" class="mb-3 d-none">
      <span id="contador" class="badge-contador"></span>
    </div>

    <div id="listaVazia" class="lista-vazia text-center d-none">
      <p>Nenhuma tarefa adicionada ainda.</p>
    </div>

    <div id="listaTarefas" class="row g-3"></div>
  </main>

  <footer>
    Feito por Ithalo Cavalcante
  </footer>

  <script src="script.js"></script>
</body>
</html>
